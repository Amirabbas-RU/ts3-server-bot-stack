[bot]
bot_group_id = 0
generate_status_avatar = false
set_status_description = false
language = "en"
run = false

[bot.commands]
matcher = "ic3"
long_message = "Split"
long_message_split_limit = 1
color = true
command_complexity = 64

[bot.commands.alias]

[bot.connect]
server_password = { pw = "", hashed = false, autohash = false }
channel_password = { pw = "", hashed = false, autohash = false }
# client_version left empty to use default
address = "teamspeak:9987"
channel = ""
badges = ""
name = "MusicBot"

[bot.connect.identity]
key = ""
offset = 0
level = -1

[bot.reconnect]
ontimeout = ["1s", "2s", "5s", "10s", "30s", "1m", "5m", "repeat last"]
onkick = []
onban = ["5m"]
onerror = ["30s", "repeat last"]
onshutdown = ["5m"]

[bot.audio]
volume = { default = 50.0, min = 25.0, max = 75.0 }
max_user_volume = 100.0
bitrate = 96
send_mode = "voice"

[bot.playlists]

[bot.history]
enabled = true
fill_deleted_ids = true

[bot.events]
onconnect = ""
ondisconnect = ""
onidle = ""
idletime = "0s"
onalone = ""
alone_delay = "0s"
onparty = ""
party_delay = "0s"

[configs]
bots_path = "bots"
send_stats = false

[db]
path = "ts3audiobot.db"

[factories]
media = { path = "" }

[tools]
youtube-dl = { path = "/usr/local/bin/youtube-dl" }

[tools.ffmpeg]
path = "ffmpeg"

[rights]
path = "rights.toml"

[plugins]
path = "plugins"

[plugins.load]

[web]
hosts = ["*"]
port = 58913

[web.api]
enabled = true
command_complexity = 64
matcher = "exact"

[web.interface]
enabled = false
