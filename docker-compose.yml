services:
  teamspeak:
    image: teamspeak:latest
    container_name: teamspeak
    restart: unless-stopped
    ports:
      - "9988:9987/udp"
      - "10012:10011"
      - "30034:30033"
    volumes:
      - ts3_data:/var/ts3server
    environment:
      TS3SERVER_LICENSE: accept
      TS3SERVER_IP_BIND: 0.0.0.0

  ts3audiobot:
    build: .
    container_name: ts3audiobot
    restart: unless-stopped
    depends_on:
      - teamspeak
    ports:
      - "58913:58913"
    volumes:
      - ts3ab_data:/data
    environment:
      TZ: UTC

volumes:
  ts3_data:
  ts3ab_data:
